<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for public/fontespatrum-og.png (1200×630). To regenerate: copy EBGaramond-VF, EBGaramond-Italic-VF
     and Inter-VF .ttf from ~/wroot-labs/brand/design-system/fonts/ into ./fonts, serve this folder
     (python3 -m http.server), screenshot the page at a 1200×630 viewport. Template: ~/security-wrootlabs/og. -->
<style>
@font-face{font-family:"EB Garamond";src:url("./fonts/EBGaramond-VF.ttf");font-weight:400 800;font-style:normal}
@font-face{font-family:"EB Garamond";src:url("./fonts/EBGaramond-Italic-VF.ttf");font-weight:400 800;font-style:italic}
@font-face{font-family:"Inter";src:url("./fonts/Inter-VF.ttf");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#f7f3ec}
body{position:relative;overflow:hidden;font-family:"Inter",sans-serif;color:#1a2128}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#2c3e4a}
.wrap{position:absolute;left:86px;right:80px;top:64px;bottom:60px;display:flex;flex-direction:column}
.eyebrow{font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#5b6b76;font-weight:500}
h1{font-family:"EB Garamond",serif;font-weight:500;font-size:132px;line-height:1;color:#2c3e4a;margin-top:44px;letter-spacing:-.01em}
h1 em{color:#a98748}
.sub{font-family:"EB Garamond",serif;font-style:italic;font-size:42px;line-height:1.3;color:#54595e;margin-top:34px;max-width:900px}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.list{font-size:23px;color:#54595e;line-height:1.4;max-width:640px}
.url{font-size:26px;font-weight:600;color:#2c3e4a;border-bottom:3px solid #c9a86a;padding-bottom:4px;white-space:nowrap}
.mark{position:absolute;right:80px;top:60px;width:56px;height:56px;border-radius:10px;background:#2c3e4a;color:#f7f3ec;font-family:"EB Garamond",serif;font-size:40px;text-align:center;line-height:56px}
</style></head>
<body>
<div class="bar"></div><div class="mark">W</div>
<div class="wrap">
  <div class="eyebrow">A Wroot Press library</div>
  <h1>Fontes <em>Patrum</em></h1>
  <p class="sub">The Fathers and the medieval masters, in Latin, Greek and English.</p>
  <div class="foot">
    <div class="list">Migne &middot; Acta Sanctorum &middot; Ambrose &middot; Bonaventure &middot; Lombard &middot; Wyclif &middot; Glossa Ordinaria</div>
    <div class="url">fontespatrum.org</div>
  </div>
</div>
</body></html>
